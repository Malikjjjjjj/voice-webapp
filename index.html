<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتبة أصوات ElevenLabs المباشرة</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --btn-green: #22c55e;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      padding: 12px;
      margin: 0;
      box-sizing: border-box;
    }
    h2 {
      text-align: center;
      color: var(--accent);
      font-size: 18px;
      margin: 8px 0 14px;
    }
    .search-box {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: var(--card-bg);
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
      margin-bottom: 14px;
      outline: none;
    }
    .search-box:focus {
      border-color: var(--accent);
    }
    .stats-bar {
      font-size: 13px;
      color: var(--subtext);
      margin-bottom: 10px;
      text-align: center;
    }
    #voices-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .voice-card {
      background: var(--card-bg);
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .voice-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .voice-title {
      font-weight: bold;
      font-size: 16px;
      color: #fff;
    }
    .voice-category {
      font-size: 11px;
      background: #334155;
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 6px;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 9px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }
    .btn-listen {
      background: #334155;
      color: var(--accent);
    }
    .btn-select {
      background: var(--btn-green);
      color: #fff;
    }
    audio {
      width: 100%;
      margin-top: 4px;
      display: none;
    }
    #loading {
      text-align: center;
      padding: 20px;
      color: var(--subtext);
    }
  </style>
</head>
<body>

  <h2>🎙️ مكتبة الأصوات الشاملة</h2>
  <input type="text" id="search" class="search-box" placeholder="🔎 ابحث عن أي صوت بالاسم..." oninput="filterVoices()">
  
  <div id="stats" class="stats-bar">جاري التجهيز...</div>
  <div id="loading">⏳ جاري تحميل أصوات ElevenLabs...</div>
  <div id="voices-container"></div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    let allVoices = [];

    async function fetchAllVoices() {
      try {
        const response = await fetch('https://api.elevenlabs.io/v1/voices');
        const data = await response.json();
        allVoices = data.voices || [];
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('stats').innerText = `إجمالي الأصوات المتاحة: ${allVoices.length} صوتًا`;
        
        renderVoices(allVoices);
      } catch (error) {
        document.getElementById('loading').innerHTML = '❌ تعذر تحميل قائمة الأصوات، يرجى المحاولة لاحقاً.';
      }
    }

    function renderVoices(voices) {
      const container = document.getElementById('voices-container');
      container.innerHTML = '';

      if (voices.length === 0) {
        container.innerHTML = '<div style="text-align:center; color: var(--subtext); padding: 20px;">لا توجد أصوات تطابق بحثك</div>';
        return;
      }

      // عرض أقصى عدد سلاسة بدون بطء
      const limit = Math.min(voices.length, 200);

      for (let i = 0; i < limit; i++) {
        const v = voices[i];
        const card = document.createElement('div');
        card.className = 'voice-card';
        card.innerHTML = `
          <div class="voice-header">
            <span class="voice-title">${v.name}</span>
            <span class="voice-category">${v.category || 'عام'}</span>
          </div>
          ${v.preview_url ? `<audio id="aud-${v.voice_id}" src="${v.preview_url}"></audio>` : ''}
          <div class="btn-group">
            ${v.preview_url ? `<button class="btn btn-listen" onclick="toggleAudio('${v.voice_id}')">🎧 استماع</button>` : ''}
            <button class="btn btn-select" onclick="selectVoice('${v.voice_id}', '${v.name}')">✅ اختيار الصوت</button>
          </div>
        `;
        container.appendChild(card);
      }
    }

    function toggleAudio(id) {
      document.querySelectorAll('audio').forEach(a => {
        if (a.id !== 'aud-' + id) {
          a.pause();
          a.style.display = 'none';
        }
      });
      const aud = document.getElementById('aud-' + id);
      if (aud) {
        if (aud.paused) {
          aud.style.display = 'block';
          aud.play();
        } else {
          aud.pause();
          aud.style.display = 'none';
        }
      }
    }

    function selectVoice(id, name) {
      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify({ voice_id: id, voice_name: name }));
        tg.close();
      } else {
        alert('تم اختيار الصوت: ' + name);
      }
    }

    function filterVoices() {
      const query = document.getElementById('search').value.toLowerCase().trim();
      const filtered = allVoices.filter(v => v.name.toLowerCase().includes(query));
      renderVoices(filtered);
    }

    fetchAllVoices();
  </script>
</body>
</html>
